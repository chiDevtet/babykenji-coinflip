[package]
name = "forge-coinflip"
version = "0.1.0"
description = "Forgepad coin-flip game program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "forge_coinflip"

[features]
default = []
mainnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

# Pinned to Anchor 0.31.1 to match the current Switchboard On-Demand randomness examples.
# Keep anchor-lang and anchor-spl in sync.
[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
switchboard-on-demand = { version = "0.10.8", default-features = false, features = ["solana-v2"] }
