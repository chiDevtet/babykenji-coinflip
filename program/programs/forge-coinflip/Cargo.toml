[package]
name = "forge-coinflip"
version = "0.1.0"
description = "Forgepad coin-flip game program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "forge_coinflip"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

# Pinned to Anchor 1.0 (current GA, shipped 2026-04). If your `avm` is on
# 0.30/0.31/0.32, set both to that version — the program source is compatible.
[dependencies]
anchor-lang = { version = "1.0", features = ["init-if-needed"] }
anchor-spl = "1.0"
