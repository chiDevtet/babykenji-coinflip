# Must match anchor-lang/anchor-spl 0.31.1 (Cargo.toml), TOOLCHAIN.md, and CI.
# The avm shim execs whatever version is pinned here — a mismatched pin runs a
# different CLI than the one the repo is built against.
[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.mainnet]
forge_coinflip = "DFmU9mwDbHkGRZ5J2f9zi59ZyDapaEv8qHhKsx8KpwAj"

[provider]
cluster = "mainnet"
wallet = "/home/deployer/deployer.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[hooks]
